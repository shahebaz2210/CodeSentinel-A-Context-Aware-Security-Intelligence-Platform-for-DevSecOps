version: "3.9"

# docker-compose.test.yml — ephemeral test environment for CI — T-172
# Uses ephemeral named volumes (destroyed after tests) and a test-only DB.

services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codesentinel_test
      POSTGRES_USER: cs_user
      POSTGRES_PASSWORD: cs_password
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_user -d codesentinel_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis_test:
    image: redis:7-alpine
    volumes:
      - redis_test_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant_test:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_test_data:/qdrant/storage
    ports:
      - "6334:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_test_data:
    driver: local
  redis_test_data:
    driver: local
  qdrant_test_data:
    driver: local

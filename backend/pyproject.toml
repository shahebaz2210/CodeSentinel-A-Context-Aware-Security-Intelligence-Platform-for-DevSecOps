[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "codesentinel-backend"
version = "0.1.0"
description = "CodeSentinel - Context-Aware Security Intelligence Platform Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Async/HTTP
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    # Queue / Workers
    "celery>=5.4.0",
    "redis>=5.0.7",
    # AI / Agents
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "google-generativeai>=0.7.0",
    # Vector DB
    "qdrant-client>=1.9.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # GitHub integration
    "PyGithub>=2.3.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    # Git operations
    "gitpython>=3.1.43",
    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "types-redis>=4.6.0",
    "factory-boy>=3.3.0",
    "faker>=25.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
